<!doctype html>
<html lang="en" data-backdrop="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>The Pill</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pill" role="group" aria-label="The Pill" aria-expanded="false">
      <section class="notification-toast" aria-label="Windows notification" aria-hidden="true" inert>
        <div class="notification-header">
          <span class="notification-app"></span>
          <button class="notification-close" type="button" aria-label="Dismiss notification">×</button>
        </div>
        <div class="notification-content">
          <strong class="notification-title"></strong>
          <p class="notification-message"></p>
        </div>
        <button class="notification-settings" type="button" hidden>Open notification settings</button>
      </section>
      <div class="pill-content">
        <section class="pill-settings-menu" aria-label="Pill Settings" aria-hidden="true" inert>
          <h2 class="pill-settings-title">Pill Settings</h2>
          <div class="pill-settings-options">
            <button class="pill-settings-option" type="button" data-pill-option="music" aria-pressed="true">
              <span class="pill-settings-indicator" aria-hidden="true"></span>
              <span>Music</span>
            </button>
            <div class="pill-settings-row">
              <button class="pill-settings-option" type="button" data-pill-option="weather" aria-pressed="true">
                <span class="pill-settings-indicator" aria-hidden="true"></span>
                <span>Weather</span>
              </button>
              <button class="weather-settings-change" type="button">Change zip</button>
              <form class="weather-settings-form" novalidate hidden>
                <span class="weather-settings-status" role="status" aria-live="polite"></span>
                <input class="weather-settings-input" type="text" inputmode="numeric" maxlength="5" placeholder="Zip code" aria-label="Zip code" autocomplete="postal-code" />
                <button class="weather-settings-save" type="submit">Save</button>
                <button class="weather-settings-cancel" type="button">Cancel</button>
              </form>
            </div>
            <button class="pill-settings-option" type="button" data-pill-option="apps" aria-pressed="true">
              <span class="pill-settings-indicator" aria-hidden="true"></span>
              <span>Apps</span>
            </button>
            <button class="pill-settings-option" type="button" data-pill-option="date" aria-pressed="true">
              <span class="pill-settings-indicator" aria-hidden="true"></span>
              <span>Date</span>
            </button>
            <button class="pill-settings-option" type="button" data-pill-option="time" aria-pressed="true">
              <span class="pill-settings-indicator" aria-hidden="true"></span>
              <span>Time</span>
            </button>
            <button class="pill-settings-option" type="button" data-pill-option="battery" aria-pressed="true">
              <span class="pill-settings-indicator" aria-hidden="true"></span>
              <span>Battery</span>
            </button>
          </div>
        </section>
        <div class="pill-actions">
          <button class="music-toggle" type="button" aria-label="Music" aria-expanded="false" aria-controls="music-controls">
            <img class="pill-icon pill-icon-light" src="pill-icons/Music Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Music Dark.png" alt="" draggable="false" />
          </button>
          <button class="apps-toggle" type="button" aria-label="Apps" aria-expanded="false" aria-controls="apps-panel">
            <img class="pill-icon pill-icon-light" src="pill-icons/Apps Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Apps Dark.png" alt="" draggable="false" />
          </button>
        </div>
        <div class="volume-controls" id="volume-controls" aria-hidden="true" inert>
          <input class="pill-slider volume-slider" id="volume-slider" type="range" min="0" max="100" step="any" value="50" aria-label="System volume" disabled />
          <output class="volume-value" for="volume-slider">--%</output>
          <span class="volume-error" role="status" aria-live="polite"></span>
        </div>
        <section class="music-controls" id="music-controls" aria-hidden="true" inert aria-label="Music player">
          <div class="music-artwork-wrap">
            <img class="music-artwork" alt="" />
            <span class="music-artwork-placeholder" aria-hidden="true">
              <img class="pill-icon pill-icon-light" src="pill-icons/Music Light.png" alt="" draggable="false" />
              <img class="pill-icon pill-icon-dark" src="pill-icons/Music Dark.png" alt="" draggable="false" />
            </span>
          </div>
          <div class="music-details">
            <span class="music-title">Nothing playing</span>
            <span class="music-artist"></span>
            <span class="music-album"></span>
            <span class="music-status" role="status" aria-live="polite">Finds music playing in Windows apps.</span>
            <div class="music-actions">
              <button class="music-previous" type="button" aria-label="Previous track" disabled>
                <span class="music-action-label" aria-hidden="true">
                  <img class="pill-icon pill-icon-light" src="pill-icons/Previous Light.png" alt="" draggable="false" />
                  <img class="pill-icon pill-icon-dark" src="pill-icons/Previous Dark.png" alt="" draggable="false" />
                </span>
              </button>
              <button class="music-play-pause" type="button" aria-label="Play or pause" disabled>
                <span class="music-action-label music-play-pause-icon" aria-hidden="true" data-icon="Play">
                  <img class="pill-icon pill-icon-light" src="pill-icons/Play Light.png" alt="" draggable="false" />
                  <img class="pill-icon pill-icon-dark" src="pill-icons/Play Dark.png" alt="" draggable="false" />
                </span>
              </button>
              <button class="music-next" type="button" aria-label="Next track" disabled>
                <span class="music-action-label" aria-hidden="true">
                  <img class="pill-icon pill-icon-light" src="pill-icons/Next Light.png" alt="" draggable="false" />
                  <img class="pill-icon pill-icon-dark" src="pill-icons/Next Dark.png" alt="" draggable="false" />
                </span>
              </button>
            </div>
          </div>
        </section>
        <section class="apps-panel" id="apps-panel" aria-hidden="true" inert aria-label="Launchable Windows apps">
          <div class="apps-panel-header">
            <input class="apps-search" type="search" aria-label="Search apps" placeholder="Search apps" autocomplete="off" />
          </div>
          <div class="apps-list" role="list" aria-label="Available apps"></div>
        </section>
        <section class="weather-panel" id="weather-panel" aria-hidden="true" inert aria-label="Weather forecast">
          <form class="weather-zip-form" novalidate>
            <span class="weather-zip-prompt">Enter your zip code to get weather from weather.gov.</span>
            <div class="weather-zip-row">
              <input class="weather-zip-input" type="text" inputmode="numeric" maxlength="5" placeholder="Zip code" aria-label="Zip code" autocomplete="postal-code" />
              <button class="weather-zip-save" type="submit">Save</button>
            </div>
            <span class="weather-zip-status" role="status" aria-live="polite"></span>
          </form>
          <div class="weather-current">
            <div class="weather-now">
              <span class="weather-temperature"></span>
              <span class="weather-description"></span>
            </div>
            <div class="weather-place">
              <span class="weather-location"></span>
              <div class="weather-status">
                <span class="weather-updated" role="status" aria-live="polite"></span>
                <button class="weather-refresh" type="button" aria-label="Refresh weather" title="Refresh weather">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" /><path d="M13.5 1.5v3h-3" /></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="weather-alerts" role="alert" hidden></p>
          <div class="weather-forecasts">
            <h3 class="weather-heading">Next 48 hours</h3>
            <div class="weather-hourly" role="list" aria-label="Hourly forecast"></div>
            <h3 class="weather-heading">This week</h3>
            <div class="weather-daily" role="list" aria-label="Weekly forecast"></div>
          </div>
          <div class="weather-day-bubble" id="weather-day-bubble" role="tooltip" hidden></div>
        </section>
        <section class="app-switcher" aria-label="Open apps" aria-hidden="true" inert>
          <div class="app-switcher-track" role="status" aria-live="polite"></div>
        </section>
        <div class="pill-datetime">
          <button class="weather-toggle" type="button" aria-label="Weather" aria-expanded="false" aria-controls="weather-panel">
            <img class="pill-icon pill-icon-light" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" alt="" draggable="false" />
            <span class="weather-toggle-label">Weather</span>
          </button>
          <button class="center-toggle" type="button" aria-label="Pill Center" aria-expanded="false" aria-controls="pill-center">
            <time class="pill-date" aria-label="Current date"></time>
            <time class="pill-clock" aria-label="Current time"></time>
            <span class="battery-percentage" aria-label="Battery charge" hidden></span>
          </button>
        </div>
      </div>
    </div>
    <div class="pill-center" id="pill-center" aria-hidden="true" inert>
      <section class="pill-center-bubble" aria-label="Pill Center" data-view="grid">
        <div class="center-view center-grid" data-center-view="grid">
          <button class="center-tile" type="button" data-center-action="volume">
            <img class="pill-icon pill-icon-light" src="pill-icons/Volume Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Volume Dark.png" alt="" draggable="false" />
            <span class="center-tile-label">Volume</span>
          </button>
          <button class="center-tile" type="button" data-center-action="nightlight" aria-pressed="false">
            <img class="pill-icon pill-icon-light" src="pill-icons/Nightlight Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Nightlight Dark.png" alt="" draggable="false" />
            <span class="center-tile-label">Night light</span>
          </button>
          <button class="center-tile" type="button" data-center-action="battery-saver" aria-pressed="false">
            <img class="pill-icon pill-icon-light" src="pill-icons/Battery Saver Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Battery Saver Dark.png" alt="" draggable="false" />
            <span class="center-tile-label">Battery saver</span>
          </button>
          <button class="center-tile" type="button" data-center-action="settings">
            <img class="pill-icon pill-icon-light" src="pill-icons/Windows Settings Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Windows Settings Dark.png" alt="" draggable="false" />
            <span class="center-tile-label">Settings</span>
          </button>
          <button class="center-tile" type="button" data-center-action="power">
            <img class="pill-icon pill-icon-light" src="pill-icons/Power Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Power Dark.png" alt="" draggable="false" />
            <span class="center-tile-label">Power</span>
          </button>
          <button class="center-tile" type="button" data-center-action="notifications" aria-label="Notifications">
            <img class="pill-icon pill-icon-light" src="pill-icons/Notifications Light.png" alt="" draggable="false" />
            <img class="pill-icon pill-icon-dark" src="pill-icons/Notifications Dark.png" alt="" draggable="false" />
            <span class="center-tile-label" aria-hidden="true">Notifications</span>
            <span class="center-unread-dot" aria-hidden="true" hidden></span>
          </button>
        </div>
        <div class="center-view center-volume" data-center-view="volume" aria-hidden="true" inert>
          <button class="center-back" type="button" aria-label="Back to Pill Center">‹</button>
          <input class="pill-slider center-volume-slider" id="center-volume-slider" type="range" min="0" max="100" step="any" value="50" aria-label="System volume" disabled />
          <output class="center-value center-volume-value" for="center-volume-slider">--%</output>
        </div>
        <div class="center-view center-nightlight" data-center-view="nightlight" aria-hidden="true" inert>
          <div class="center-header">
            <button class="center-back" type="button" aria-label="Back to Pill Center">‹</button>
            <h2 class="center-title">Night light</h2>
            <button class="center-switch nightlight-switch" type="button" aria-label="Night light" aria-pressed="false" disabled>
              <span class="pill-settings-indicator" aria-hidden="true"></span>
            </button>
          </div>
          <div class="center-slider-row">
            <span class="center-slider-label">Intensity</span>
            <input class="pill-slider nightlight-slider" id="nightlight-slider" type="range" min="0" max="100" step="1" value="50" aria-label="Night light intensity" disabled />
            <output class="center-value nightlight-value" for="nightlight-slider">--%</output>
          </div>
          <span class="center-status nightlight-status" role="status" aria-live="polite"></span>
        </div>
        <div class="center-view center-power" data-center-view="power" aria-hidden="true" inert>
          <div class="center-header">
            <button class="center-back" type="button" aria-label="Back to Pill Center">‹</button>
            <h2 class="center-title">Power</h2>
          </div>
          <div class="center-options">
            <button class="center-option" type="button" data-power-action="lock">Lock</button>
            <button class="center-option" type="button" data-power-action="shutdown">Shut down</button>
            <button class="center-option" type="button" data-power-action="restart">Restart</button>
          </div>
        </div>
        <div class="center-view center-notifications" data-center-view="notifications" aria-hidden="true" inert>
          <div class="center-header">
            <button class="center-back" type="button" aria-label="Back to Pill Center">‹</button>
            <h2 class="center-title">Notifications</h2>
            <button class="center-clear" type="button" disabled>Clear</button>
          </div>
          <div class="center-notification-list" role="list" aria-label="Recent notifications"></div>
          <p class="center-empty">No notifications since The Pill started.</p>
        </div>
      </section>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
