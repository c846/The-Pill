[package]
name = "the-pill"
version = "3.0.0"
description = "A pill-shaped desktop overlay for Windows."
authors = ["c846"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Uses Windows' own TLS (Schannel), so nothing extra has to be compiled for HTTPS.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Declaring a COM interface Windows doesn't publish (Do Not Disturb) needs this directly.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
